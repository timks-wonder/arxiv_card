<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录页面</title>
    <link rel="icon" href="/static/images/logo.png" type="image/jpg">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.2.47/dist/vue.global.min.js"></script>
    <style>
        /* 保持原有样式不变 */
        body {
            background: url('/static/images/bg.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .login-container {
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }
        h2 {
            color: white;
            margin-bottom: 30px;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background-color: #444;
            color: white;
            font-size: 16px;
        }
        /* input[type="text"]::placeholder, */
        /* input[type="password"]::placeholder {
            color: #aaa;
        } */
        .icon {
            position: relative;
        }
        .icon::after {
            content: '';
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="white" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
        }
        .password-icon::after {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="white" d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM8.9 6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2H8.9V6z"/></svg>');
        }
        button {
            background-color: #e74c3c;
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        button.login-btn {
            background-color: #e74c3c;
        }
        button.register-btn {
            background-color: #3498db;
        }
        button:hover {
            background-color: #c0392b;
        }
        button.register-btn:hover {
            background-color: #2980b9;
        }
        button.guest-btn {
            background-color: #2ecc71;
        }
        button.guest-btn:hover {
            background-color: #27ae60;
        }
        .form-switch {
            margin-top: 15px;
            color: #aaa;
        }
        .form-switch a {
            color: #f9f7f6;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="login-container">
            <h2>arXiv Cards</h2>
            
            <!-- 登录表单 -->
            <div v-if="showLogin">
                <form @submit.prevent="handleLogin">
                    <div class="icon">
                        <input type="text" v-model="loginForm.username" placeholder="用户名" required>
                    </div>
                    <div class="icon password-icon">
                        <input type="password" v-model="loginForm.password" placeholder="密码" required>
                    </div>
                    <button type="submit" class="login-btn">登录</button>
                </form>
                <button @click="handleGuestLogin" class="guest-btn" style="margin-top: 10px;">
                    游客登录
                </button>
                <div class="form-switch">
                    <a href="#" @click="toggleForms">没有账号？立即注册</a>
                </div>
            </div>
            
            <!-- 注册表单 -->
            <div v-else>
                <form @submit.prevent="handleRegister">
                    <div class="icon">
                        <input type="text" v-model="registerForm.username" placeholder="创建用户名" required>
                    </div>
                    <div class="icon password-icon">
                        <input type="password" v-model="registerForm.password" placeholder="设置密码" required>
                    </div>
                    <button type="submit" class="register-btn">注册</button>
                </form>
                <div class="form-switch">
                    <a href="#" @click="toggleForms">已有账号？立即登录</a>
                </div>
            </div>
        </div>
        
        <!-- 新增用户统计div -->
        <div class="user-count" style="position: fixed; bottom: 10px; right: 10px; color: #aaa; font-size: 12px;">
            本站已注册用户数: {{ user_count }}
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        
        createApp({
            data() {
                return {
                    showLogin: true,
                    loginForm: {
                        username: '',
                        password: ''
                    },
                    registerForm: {
                        username: '',
                        password: ''
                    }
                }
            },
            mounted() {
                // 获取用户数
                fetch('/auth/user_count')
                    .then(response => response.json())
                    .then(data => {
                        document.querySelector('.user-count').textContent = `本站已注册用户数: ${data.count}`;
                    })
            },
            methods: {
                toggleForms() {
                    this.showLogin = !this.showLogin;
                },
                handleLogin() {
                    const formData = new FormData();
                    formData.append('username', this.loginForm.username);
                    formData.append('password', this.loginForm.password);
                    
                    fetch('/auth/login', {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => {
                        if (response.redirected) {
                            window.location.href = response.url;
                        } else {
                            return response.text().then(text => {
                                alert(text || '登录失败');
                            });
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('请求失败');
                    });
                },
                handleRegister() {
                    const formData = new FormData();
                    formData.append('username', this.registerForm.username);
                    formData.append('password', this.registerForm.password);
                    
                    fetch('/auth/register', {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => {
                        if (response.redirected) {
                            window.location.href = response.url;
                        } else {
                            return response.text().then(text => {
                                if (text.includes('成功')) {
                                    alert('注册成功，请登录');
                                    this.showLogin = true;
                                    this.registerForm = { username: '', password: '' };
                                } else {
                                    alert(text || '注册失败');
                                }
                            });
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('请求失败');
                    });
                },
                async handleGuestLogin() {
                    try {
                        // 生成随机ID
                        const newId = Math.floor(Math.random() * 1000000);
                        const guestUsername = `undefined_user_${newId}`;
                        const guestPassword = 'undefined_key';
                        
                        // 创建游客账户
                        // 修改游客登录部分
                        const formData = new FormData();
                        formData.append('username', guestUsername);
                        formData.append('password', guestPassword);
                        
                        const registerResponse = await fetch('/auth/register', {
                            method: 'POST',
                            body: formData
                        });
                        
                        if (registerResponse.redirected) {
                            // 直接登录
                            const loginResponse = await fetch('/auth/login', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/x-www-form-urlencoded',
                                },
                                body: `username=${encodeURIComponent(guestUsername)}&password=${encodeURIComponent(guestPassword)}`
                            });
                            
                            if (loginResponse.redirected) {
                                window.location.href = loginResponse.url;
                            } else {
                                alert('自动登录失败，请手动登录');
                            }
                        } else {
                            const result = await registerResponse.text();
                            alert(result || '创建游客账户失败');
                        }
                    } catch (error) {
                        console.error('游客登录错误:', error);
                        alert('游客登录失败');
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
