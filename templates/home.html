<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arXiv Cards 主页</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.2.47/dist/vue.global.min.js"></script>
    <style>
        body {
            background: url('/user_data/user_{{ session.user_id }}/bg.jpg');
            background-size: cover;
            min-height: 100vh;
        }
        .navbar_1 {
            margin: 1rem auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            background-color: rgba(255, 255, 255, 0.7)
        }
        .feature-card {
            margin: 1rem auto;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            background-color: rgba(255, 255, 255, 0.7)
        }
        .feature-card:hover {
            transform: translateY(-3px);
        }
        .dashboard-section {
            margin-top: 3rem;
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
        #keywordTags {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .keyword-badge {
            padding: 0.5rem 1rem;
            background-color: #e9ecef;
            border-radius: 20px;
            font-size: 0.9rem;
            position: relative;
        }
        .close-btn {
            cursor: pointer;
            margin-left: 8px;
            color: #888;
            font-size: 1.2rem;
            line-height: 1;
        }
        .close-btn:hover {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container py-4">
            <nav class="navbar navbar_1 mb-4 rounded">
                <div class="container-fluid">
                    <span class="navbar-brand">arXiv Cards</span>
                    <div class="d-flex">
                        <span class="navbar-text me-3">
                            欢迎，<span v-text="username"></span>
                            <span id="userId" style="display:none" v-text="userId"></span>
                        </span>
                        <button class="btn btn-outline-secondary me-3" @click="goHome">主页</button>
                        <button class="btn btn-outline-secondary" @click="logout">退出</button>
                    </div>
                </div>
            </nav>

            <div class="text-center mb-5">
                <h1 class="display-4 text-white">欢迎使用 arXiv Cards</h1>
                <p class="lead text-white">您的个性化论文推荐平台</p>
            </div>

            <div class="row dashboard-section">
                <!-- 新增背景图片上传模块 -->
                <div class="col-md-6">
                    <div class="feature-card">
                        <h4>🎨 自定义背景</h4>
                        <div class="mb-3">
                            <input type="file" class="form-control" id="bgUpload" accept="image/*">
                        </div>
                        <button class="btn btn-primary w-100" @click="uploadBg">上传背景</button>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="feature-card">
                        <h4>📚 论文浏览</h4>
                        <button class="btn btn-primary w-100" @click="goToBrowse">开始浏览</button>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="feature-card">
                        <h4>⭐ 我的收藏</h4>
                        <button class="btn btn-outline-secondary w-100" disabled>即将推出</button>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="feature-card">
                        <h4 class="d-flex justify-content-between align-items-center">
                            <span>☁️ 腾讯云配置（用于机器翻译）</span>
                            <a href="https://console.cloud.tencent.com/tmt" target="_blank" class="text-decoration-none small">获取</a>
                        </h4>

                        <div class="mb-3">
                            <label class="form-label">Secret ID</label>
                            <input type="text" class="form-control" v-model="tencentSecretId">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Secret Key</label>
                            <input type="password" class="form-control" v-model="tencentSecretKey">
                        </div>
                        <button class="btn btn-success w-100" @click="saveTencentConfig">保存配置</button>
                        <p class="text-muted small mt-2 mb-0">请前往腾讯云机器翻译控制台获取您的ID和API密钥，腾讯云的机器翻译API每个月给500w字的免费额度，完全满足个人需求</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>

        const base_url = "{{ base_url }}" || new URLSearchParams(window.location.search).get('base_url') || 'localhost';
        const port = "{{ port }}" || new URLSearchParams(window.location.search).get('port') || '5001';
        const URL = `http://${base_url}:${port}`;
        const { createApp } = Vue;
        
        createApp({
            data() {
                return {
                    username: "{{ username }}",
                    userId: "{{ session.user_id }}",
                    tencentSecretId: '',
                    tencentSecretKey: ''
                }
            },
            methods: {
                logout() {
                    fetch('/auth/logout', { method: 'POST' })
                        .then(() => window.location.href = '/auth/login');
                },
                goHome() {
                    window.location.href = "/home/gohome";
                },
                goToBrowse() {
                    window.location.href = '/';
                },
                saveTencentConfig() {
                    const config = {
                        secret_id: this.tencentSecretId,
                        secret_key: this.tencentSecretKey
                    };
                    
                    fetch('/home/save_tencent_config', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(config)
                    })
                    .then(response => response.json())
                    .then(data => {
                        if(data.success) {
                            alert('配置保存成功');
                        } else {
                            alert('保存失败: ' + data.message);
                        }
                    });
                },
                uploadBg() {
                    const fileInput = document.getElementById('bgUpload');
                    if (!fileInput.files.length) {
                        alert('请先选择图片文件');
                        return;
                    }
                    
                    const formData = new FormData();
                    formData.append('bg_file', fileInput.files[0]);
                    
                    fetch('/home/upload_bg', {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => response.json())
                    .then(data => {
                        if(data.success) {
                            alert('背景图片上传成功');
                            location.reload(); // 刷新页面显示新背景
                        } else {
                            alert('上传失败: ' + data.message);
                        }
                    });
                }
            },
            mounted() {
                // 加载已有的配置
                fetch('/home/get_tencent_config')
                    .then(response => response.json())
                    .then(data => {
                        if(data.secret_id) this.tencentSecretId = data.secret_id;
                        if(data.secret_key) this.tencentSecretKey = data.secret_key;
                    });
            }
        }).mount('#app');
    </script>
</body>
</html>
