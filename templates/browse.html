<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.2.47/dist/vue.global.min.js"></script>
    <style>
        body {
            background: url('/user_data/user_{{ session.user_id }}/bg.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }
        .navbar_1 {
            margin: 1rem auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            background-color: rgba(255, 255, 255, 0.7)
        }
        .paper-card {
            margin: 1rem auto;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            background-color: rgba(255, 255, 255, 0.7)
        }
        .paper-card:hover {
            transform: translateY(-3px);
        }
        .action-button {
            margin: auto auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
        }
        .summary-container {
            position: relative;
        }
        .summary-content {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: all 0.3 ease;
            margin-bottom: 0.5rem;
        }
        .summary-content.expanded {
            -webkit-line-clamp: unset;
        }
        .btn-expand {
            padding: 0;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container py-4">
            <nav class="navbar navbar_1 mb-4 rounded">
                <div class="container-fluid">
                    <span class="navbar-brand">arXiv Cards</span>
                    <div class="d-flex">
                        <span class="navbar-text me-2">欢迎，<span v-text="username"></span></span>
                        <span id="userId" style="display: none" v-text="userId"></span>
                        <button class="btn shadow-sm me-2" @click="goHome()">我的</button>
                        <button class="btn shadow-sm" @click="logout()">退出</button>
                    </div>
                </div>
            </nav>
            <h3 class="mb-4 d-flex align-items-center justify-content-between">
                <span>论文推荐</span>
                <div class="d-flex align-items-center">
                    <!-- 添加搜索框 -->
                    <div class="input-group me-3" style="width: 250px;">
                        <input type="text" class="form-control" placeholder="搜索论文..." v-model="searchQuery">
                        <button class="btn btn-primary" type="button" @click="handleSearch">🔍
                        </button>
                    </div>
                    
                    <!-- 原有日期筛选控件 -->
                    <input type="date" v-model="startDate" class="form-control me-2" style="width: 150px;">
                    <span class="align-self-center me-2">至</span>
                    <input type="date" v-model="endDate" class="form-control me-2" style="width: 150px;">
                    <button class="btn btn-primary" @click="filterByDate">筛选</button>
                </div>
            </h3>
            
            <div id="paperContainer" v-if="papers.length > 0">
                <div v-for="paper in papers" :key="paper.id" class="paper-card">
                    <div class="row">
                        <!-- 左半部分 - 根据是否有翻译内容动态调整宽度 -->
                        <div :class="{'col-md-12': !paper.translatedTitle && !paper.translatedSummary, 'col-md-6 border-end': paper.translatedTitle || paper.translatedSummary}">
                            <h5><a :href="paper.url" target="_blank" v-text="paper.title"></a></h5>
                            <div class="text-muted mb-2">作者: <span v-text="paper.authors"></span></div>
                            <div class="text-muted mb-2 d-flex align-items-center">
                                <span class="badge bg-secondary me-2" v-text="paper.categories"></span>
                                <small class="text-muted">发布时间：<span v-text="formatDate(paper.published)"></span></small>
                            </div>
                            <div class="summary-container">
                                <p class="text-secondary summary-content" :class="{expanded: paper.expanded}">
                                    摘要：<span v-text="paper.summary"></span>
                                </p>
                                <button class="btn btn-link btn-sm p-0" @click="toggleSummary(paper)">
                                    <template v-if="paper.expanded">收起</template>
                                    <template v-else>展开</template>
                                </button>
                                <div class="action-buttons d-flex justify-content-end" v-if="!paper.translatedTitle && !paper.translatedSummary">
                                    <button class="btn btn-secondary me-2" title="dislike" data-bs-toggle="tooltip" 
                                            @click="handleAction(paper, 'dislike')">👎</button>
                                    <button class="btn btn-danger" title="like" data-bs-toggle="tooltip" 
                                            @click="handleAction(paper, 'like')">👍</button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 右半部分 - 翻译内容 -->
                        <div class="col-md-6" v-if="paper.translatedTitle || paper.translatedSummary">
                            <h5><a :href="paper.url" target="_blank" v-text="paper.translatedTitle || '...'"></a></h5>
                            <div class="text-muted mb-2">作者: <span v-text="paper.authors"></span></div>
                            <div class="text-muted mb-2 d-flex align-items-center">
                                <span class="badge bg-secondary me-2" v-text="paper.categories"></span>
                                <small class="text-muted">发布时间：<span v-text="formatDate(paper.published)"></span></small>
                            </div>
                            <div class="summary-container">
                                <p class="text-secondary summary-content" :class="{expanded: paper.expanded}">
                                    摘要：<span v-text="paper.translatedSummary || '...'"></span>
                                </p>
                                <div class="action-buttons d-flex justify-content-end">
                                    <button class="btn btn-secondary me-2" title="dislike" data-bs-toggle="tooltip" 
                                            @click="handleAction(paper, 'dislike')">👎</button>
                                    <button class="btn btn-danger" title="like" data-bs-toggle="tooltip" 
                                            @click="handleAction(paper, 'like')">👍</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 修改PDF预览部分 -->
                    <div class="mt-3">
                        <button class="btn btn-primary mb-2" @click="togglePdfPreview(paper)">
                            <template v-if="paper.showPdf">PDF</template>
                            <template v-else>PDF</template>
                        </button>
                        <div v-if="paper.showPdf">
                            <iframe 
                                class="pdf-iframe" 
                                :src="`/static/pdfjs/web/viewer.html?file=${encodeURIComponent('/proxy/pdf?url=' + encodeURIComponent(paper.url.replace('abs', 'pdf') + '.pdf'))}`"
                                style="width: 100%; height: 500px; border: 1px solid #ddd; border-radius: 4px;">
                            </iframe>
                        </div>
                    </div>
                </div>
            </div>
            <div v-else class="text-center py-5">
                <p class="text-muted">暂无推荐论文，请稍后再试</p>
            </div>
        </div>
    </div>
    <script>
        const URL = "http://{{ base_url }}:{{ port }}";
        const num_papers_show = 3;
        console.log(URL);
        const {createApp} = Vue;
    
        createApp({
            data() {
                return {
                    username: "{{username}}",
                    userId: "{{session.user_id}}",
                    papers: [],
                    loadingTranslations: false,
                    startDate: '', // 筛选开始日期
                    endDate: '',   // 筛选结束日期
                    filterParams: {}, // 新增筛选参数存储
                    searchQuery: '' // 新增搜索关键词
                }
            },
            mounted() {
                this.loadNewPapers(num_papers_show);
                this.initTooltips();
            },
            methods: {
                goHome() {
                    window.location.href = `/home/gohome?base_url=${encodeURIComponent("{{ base_url }}")}&port=${encodeURIComponent("{{ port }}")}`;
                },
                logout() {
                    fetch("/auth/logout", { method: "POST" })
                    .then(() => {window.location.href = "/auth/login";})
                },
                async translatePaper(paper) {
                    try {
                        // 翻译标题
                        const titleResponse = await fetch(`${URL}/api/translate`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                text: paper.title,
                                from: 'en',
                                to: 'zh',
                                user_id: this.userId  // 新增用户ID参数
                            })
                        });
                        const titleData = await titleResponse.json();
                        
                        // 翻译摘要
                        const summaryResponse = await fetch(`${URL}/api/translate`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                text: paper.summary,
                                from: 'en',
                                to: 'zh',
                                user_id: this.userId  // 新增用户ID参数
                            })
                        });
                        const summaryData = await summaryResponse.json();
    
                        // 直接赋值代替$set
                        paper.translatedTitle = titleData.translated;
                        paper.translatedSummary = summaryData.translated;
                        
                    } catch (error) {
                        console.error('翻译失败:', error);
                        // 如果翻译失败，显示原文
                        paper.translatedTitle = paper.title;
                        paper.translatedSummary = paper.summary;
                    }
                },
    
                async loadNewPapers(count) {
                    try {
                        this.loadingTranslations = true;
                        
                        let url = `${URL}/api/papers?user_id=${this.userId}`;
                        if (this.filterParams.start_date) {
                            url += `&start_date=${this.filterParams.start_date}`;
                        }
                        if (this.filterParams.end_date) {
                            url += `&end_date=${this.filterParams.end_date}`;
                        }
                        const response = await fetch(url);
                        const papers = await response.json();
    
                        const newPapers = papers.slice(0, count).map(paper => ({
                            ...paper,
                            expanded: false,
                            showPdf: false,  // 新增PDF预览状态
                            translatedTitle: '',
                            translatedSummary: ''
                        }));
    
                        this.papers.push(...newPapers);
                        // 如果论文数量超过3篇，移除最早的论文
                        if (this.papers.length > num_papers_show) {
                            this.papers = this.papers.slice(-num_papers_show);
                        }

                        // 为每篇论文启动翻译
                        for (const paper of newPapers) {
                            await this.translatePaper(paper);
                            // 添加强制更新
                            this.$forceUpdate(); // 新增这行
                            await fetch(`${URL}/api/viewed?user_id=${this.userId}&paper_id=${paper.id}`);
                        }
                    }
                    catch (error) {
                        console.error("Error loading new papers:", error);
                    }
                },
                formatDate(dateString) {
                    return new Date(dateString).toLocaleDateString();
                },
                toggleSummary(paper) {
                    paper.expanded = !paper.expanded;
                },
                togglePdfPreview(paper) {
                    paper.showPdf = !paper.showPdf;
                    this.$forceUpdate();
                },
                async handleAction(paper, actionType) {
                    const paperIndex = paper.id

                    try {
                        await fetch(`${URL}/api/${actionType}`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                user_id: this.userId,
                                paper_id: paperIndex,
                                summary_embeddings: paper.summary_embeddings,
                            }),
                        });

                        this.papers = this.papers.filter(p => p.id !== paperIndex);
                        this.loadNewPapers(1);
                    }
                    catch (error) {
                        console.error(`Error ${actionType} paper:`, error);
                    }
                },
                filterByDate() {
                    this.filterParams = {
                        start_date: this.startDate,
                        end_date: this.endDate
                    };
                    this.papers = [];
                    this.loadNewPapers(num_papers_show);
                },
                handleSearch() {
                    if(this.searchQuery.trim()) {
                        window.location.href = `/search.html?q=${encodeURIComponent(this.searchQuery)}`;
                    }
                },
                initTooltips() {
                    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
                    tooltipTriggerList.forEach(function(tooltipTriggerEl) {
                        new bootstrap.Tooltip(tooltipTriggerEl);
                    });
                }
            }
        }).mount("#app");
    </script>
</body>
</html>
