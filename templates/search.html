<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arXiv Cards - 搜索结果</title>
    <link rel="icon" href="/static/images/logo.png" type="image/jpg">
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.2.47/dist/vue.global.min.js"></script>
    <style>
        body {
            background: url('/user_data/user_{{ session.user_id }}/bg.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }
        .navbar_1 {
            margin: 1rem auto;
            /* border-radius: 8px; */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            background-color: rgba(255, 255, 255, 0.7)
        }
        .paper-card {
            margin: 1rem auto;
            padding: 1.5rem;
            /* border-radius: 8px; */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            background-color: rgba(255, 255, 255, 0.7)
        }
        .paper-card:hover {
            transform: translateY(-3px);
        }
        .action-button {
            margin: auto auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
        }
        .summary-container {
            position: relative;
        }
        .summary-content {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: all 0.3 ease;
            margin-bottom: 0.5rem;
        }
        .summary-content.expanded {
            -webkit-line-clamp: unset;
        }
        .btn-expand {
            padding: 0;
            font-size: 0.875rem;
        }

        /* 新增评论项样式 */
        .comment-item {
            background-color: rgba(225, 225, 225, 0.7);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 0.5rem;
            padding-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container py-4">
            <nav class="navbar navbar_1 mb-4">
                <div class="container-fluid">
                    <span class="navbar-brand">
                        <img src="/static/images/logo.png" alt="arXiv Cards Logo" style="height: 30px; margin-right: 10px;">
                        arXiv Cards
                    </span>
                    <div class="d-flex">
                        <span class="navbar-text me-2">欢迎，<span v-text="username"></span></span>
                        <span id="userId" style="display: none" v-text="userId"></span>
                        <button class="btn shadow-sm me-2" @click="goToBrowse()">论文</button>
                        <button class="btn shadow-sm me-2" @click="goHome()">我的</button>
                        <button class="btn shadow-sm" @click="logout()">退出</button>
                    </div>
                </div>
            </nav>
            <h3 class="mb-4 d-flex align-items-center justify-content-between">
                <span>搜索结果</span>
                <div class="d-flex align-items-center">
                    <!-- 保留搜索框 -->
                    <div class="input-group me-3" style="width: 250px;">
                        <input type="text" class="form-control" placeholder="搜索论文..." v-model="searchQuery">
                        <button class="btn btn-dark" type="button" @click="handleSearch">🔍</button>
                    </div>
                </div>
            </h3>
            
            <div id="paperContainer" v-if="papers.length > 0">
                <div v-for="paper in papers" :key="paper.id" class="paper-card">
                    <div class="row">
                        <!-- 修改左半部分 - 根据是否有翻译内容动态调整宽度 -->
                        <div :class="{'col-md-12': !paper.translatedTitle && !paper.translatedSummary, 'col-md-6 border-end': paper.translatedTitle || paper.translatedSummary}">
                            <h5><a :href="paper.url" target="_blank" v-text="paper.title"></a></h5>
                            <div class="text-muted mb-2 d-flex align-items-center">
                                <span class="badge bg-secondary me-2" v-text="paper.categories"></span>
                                <small class="text-muted">发布时间：<span v-text="formatDate(paper.published)"></span></small>
                            </div>
                            <div class="text-muted mb-2">作者: <span v-text="paper.authors"></span></div>
                            <div class="summary-container">
                                <p class="text-secondary summary-content" :class="{expanded: paper.expanded}">
                                    摘要：<span v-text="paper.summary"></span>
                                </p>
                                <button class="btn btn-link btn-sm p-0" @click="toggleSummary(paper)">
                                    <template v-if="paper.expanded">收起</template>
                                    <template v-else>展开</template>
                                </button>

                                <div class="action-buttons d-flex justify-content-end">                                    
                                    <button 
                                        :class="{'btn btn-danger me-2': paper.isCollected, 'btn btn-outline-danger me-2': !paper.isCollected}" 
                                        title="collection" 
                                        data-bs-toggle="tooltip" 
                                        @click="handleCollection(paper)">
                                        ⭐️
                                    </button>
                                    </div>
                            </div>
                        </div>
                        
                        <!-- 右半部分 - 翻译内容，仅在存在翻译时显示 -->
                        <div class="col-md-6" v-if="paper.translatedTitle || paper.translatedSummary">
                            <h5><a :href="paper.url" target="_blank" v-text="paper.translatedTitle || '...'"></a></h5>
                            <div class="text-muted mb-2 d-flex align-items-center">
                                <span class="badge bg-secondary me-2" v-text="paper.categories"></span>
                                <small class="text-muted">发布时间：<span v-text="formatDate(paper.published)"></span></small>
                            </div>
                            <div class="text-muted mb-2">作者: <span v-text="paper.authors"></span></div>
                            <div class="summary-container">
                                <p class="text-secondary summary-content" :class="{expanded: paper.expanded}">
                                    摘要：<span v-text="paper.translatedSummary || '...'"></span>
                                </p>
                                <div class="action-buttons d-flex justify-content-end">                                    
                                <button 
                                    :class="{'btn btn-danger me-2': paper.isCollected, 'btn btn-outline-danger me-2': !paper.isCollected}" 
                                    title="collection" 
                                    data-bs-toggle="tooltip" 
                                    @click="handleCollection(paper)">
                                    ⭐️
                                </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- PDF预览部分保持不变 -->
                    <div class="mt-3">
                        <button class="btn btn-dark mb-2" @click="togglePdfPreview(paper)">
                            <template v-if="paper.showPdf">PDF</template>
                            <template v-else>PDF</template>
                        </button>
                        <div v-if="paper.showPdf">
                            <iframe 
                                class="pdf-iframe" 
                                :src="`https://arxiv.org/pdf/${paper.url.split('/').pop()}.pdf`"
                                style="width: 100%; height: 500px; border: 1px solid #ddd; border-radius: 4px;">
                            </iframe>
                        </div>
                    </div>
                    <!-- 新增评论区域 -->
                    {% raw %}
                    <div class="mt-3 comment-section">
                        <h6>评论</h6>
                        <div v-for="(comment, index) in paper.comments.slice(0, paper.showAllComments ? paper.comments.length : 3)" 
                             :key="comment.id" 
                             class="comment-item p-2">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <strong>{{ comment.username }}</strong>
                                    <small class="text-muted ms-2">{{ formatDate(comment.timestamp) }}</small>
                                </div>
                                <button v-if="comment.username === username" 
                                        class="btn btn-link btn-sm"
                                        @click="deleteComment(paper, comment.id)">
                                    删除
                                </button>
                            </div>
                            <p class="mb-1">{{ comment.content }}</p>
                        </div>
                        <div v-if="paper.comments.length > 3" class="text-center mt-2">
                            <button class="btn btn-link btn-sm" @click="paper.showAllComments = !paper.showAllComments">
                                {{ paper.showAllComments ? '收起' : '展开更多' }}
                            </button>
                        </div>
                        <div class="input-group mt-2">
                            <input type="text" class="form-control" v-model="paper.newComment" 
                                   placeholder="发表你的看法..." @keyup.enter="addComment(paper)">
                            <button class="btn btn-dark" @click="addComment(paper)">💬</button>
                        </div>
                    </div>
                    {% endraw %}
                </div>
            </div>
            <div v-else class="text-center py-5">
                <p class="text-muted">加载中...</p>
            </div>
        </div>
    </div>
    <script>
        // 优先使用模板变量，如果没有再从URL获取
        const base_url = "{{ base_url }}" || new URLSearchParams(window.location.search).get('base_url');
        const port = "{{ port }}" || new URLSearchParams(window.location.search).get('port');
        const URL = `https://${base_url}:${port}`;
        const {createApp} = Vue;
    
        createApp({
            data() {
                return {
                    username: "{{username}}",
                    userId: "{{session.user_id}}",
                    papers: [],
                    loadingTranslations: false,
                    searchQuery: new URLSearchParams(window.location.search).get('q') || ''
                }
            },
            mounted() {
                this.loadSearchResults();
                this.initTooltips();
            },
            methods: {
                goToBrowse() {
                    window.location.href = '/';
                },
                goHome() {
                    window.location.href = "/home/gohome";
                },
                logout() {
                    fetch("/auth/logout", { method: "POST" })
                    .then(() => {window.location.href = "/auth/login";})
                },
                async translatePaper(paper) {
                    try {
                        const titleResponse = await fetch(`${URL}/api/translate`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                text: paper.title,
                                from: 'en',
                                to: 'zh',
                                user_id: this.userId
                            })
                        });
                        const titleData = await titleResponse.json();
                        
                        const summaryResponse = await fetch(`${URL}/api/translate`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                text: paper.summary,
                                from: 'en',
                                to: 'zh',
                                user_id: this.userId
                            })
                        });
                        const summaryData = await summaryResponse.json();
    
                        paper.translatedTitle = titleData.translated;
                        paper.translatedSummary = summaryData.translated;
                        
                    } catch (error) {
                        console.error('翻译失败:', error);
                        paper.translatedTitle = paper.title;
                        paper.translatedSummary = paper.summary;
                    }
                },
                async loadSearchResults() {
                    try {
                        this.loadingTranslations = true;
                        
                        if (!this.searchQuery.trim()) return;
                        
                        const response = await fetch(`${URL}/api/search?q=${encodeURIComponent(this.searchQuery)}&user_id=${this.userId}`);
                        const papers = await response.json();
    
                        this.papers = papers.map(paper => ({
                            ...paper,
                            expanded: false,
                            showPdf: false,
                            translatedTitle: '',
                            translatedSummary: '',
                            newComment: '',
                            comments: []
                        }));
    
                        for (const paper of this.papers) {
                            await this.translatePaper(paper);
                            await this.loadComments(paper.id);
                            this.$forceUpdate();
                        }
                    }
                    catch (error) {
                        console.error("Error loading search results:", error);
                    }
                    finally {
                        this.loadingTranslations = false;
                    }
                },
                formatDate(dateString) {
                    return new Date(dateString).toLocaleDateString();
                },
                toggleSummary(paper) {
                    paper.expanded = !paper.expanded;
                },
                togglePdfPreview(paper) {
                    paper.showPdf = !paper.showPdf;
                    this.$forceUpdate();
                },
                async handleCollection(paper) {
                    try {
                        // 切换收藏状态
                        paper.isCollected = !paper.isCollected;
                        
                        await fetch(`${URL}/api/collection`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                user_id: this.userId,
                                paper: paper,
                                action: paper.isCollected ? 'collect' : 'uncollect',
                            }),
                        });
                        
                        this.$forceUpdate(); // 强制更新视图
                    }
                    catch (error) {
                        console.error('Error handling collection:', error);
                        // 出错时恢复状态
                        paper.isCollected = !paper.isCollected;
                    }
                },
                async addComment(paper) {
                    if (!paper.newComment || !paper.newComment.trim()) return;
                    
                    try {
                        const response = await fetch(`${URL}/api/comments`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                paper_id: paper.id,
                                user_id: this.userId,
                                content: paper.newComment
                            })
                        });
                        
                        const newComment = await response.json();
                        if (!paper.comments) {
                            this.$set(paper, 'comments', []);
                        }
                        paper.comments.push(newComment);
                        paper.newComment = '';
                        await this.loadComments(paper.id);
                    } catch (error) {
                        console.error('添加评论失败:', error);
                    }
                },
                async loadComments(paperId) {
                    try {
                        const response = await fetch(`${URL}/api/papers/${paperId}/comments`);
                        const comments = await response.json();
                        const targetPaper = this.papers.find(p => p.id === paperId);
                        if (targetPaper) {
                            targetPaper.comments = comments;
                            this.$forceUpdate();
                        }
                    } catch (error) {
                        console.error('加载评论失败:', error);
                    }
                },
                async deleteComment(paper, commentId) {
                    try {
                        const response = await fetch(`${URL}/api/comments/${commentId}`, {
                            method: "DELETE",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                user_id: this.userId
                            })
                        });
                        
                        if (response.ok) {
                            // 从本地评论列表中移除
                            paper.comments = paper.comments.filter(c => c.id !== commentId);
                            this.$forceUpdate();
                        } else {
                            console.error('删除评论失败:', await response.text());
                            alert('删除评论失败');
                        }
                    } catch (error) {
                        console.error('删除评论出错:', error);
                        alert('删除评论时出错');
                    }
                },
            }
        }).mount("#app");
    </script>
</body>
</html>
